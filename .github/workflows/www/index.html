<title>My Daily Planner</title>
<style>

:root[data-theme="dark"]{--bg:#121917;--card:#1b2522;--ink:#e6efec;--mute:#90a39d;--line:#2c3a36;--accent:#4fc3a1;--accent-ink:#0c1512;--danger:#e0877d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:600px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-size:1.7rem;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 10px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lang{flex:none;padding:6px 14px;background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:600}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin-bottom:16px}
.bar span{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.views{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
.clock{margin:0 0 12px}.time{font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}.date{color:var(--mute)}

.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.nav{background:transparent;color:var(--ink);font-size:1.3rem;padding:2px 12px;border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wd{color:var(--mute);font-size:.8rem}
.day{aspect-ratio:1;background:transparent;color:var(--ink);border-radius:8px;padding:0;position:relative}
.day.today{border:1px solid var(--accent)}
.day.sel{background:var(--accent);color:var(--accent-ink)}
.day.has::after{content:"";position:absolute;left:50%;bottom:4px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--danger)}
.sl{margin-top:10px;font-weight:600}
.view{padding:10px;background:var(--card);color:var(--mute);border:1px solid var(--line);font-weight:600}
.view[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
form{display:grid;grid-template-columns:1fr auto;gap:8px}
input[type=text],input[type=datetime-local]{min-width:0;padding:11px 12px;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px}
.when{grid-column:1/-1;display:flex;align-items:center;gap:8px;color:var(--mute);font-size:.9rem}
.when input{flex:1}
.add{padding:0 18px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.tabs{display:flex;gap:6px;margin:14px 0 10px}
.tab{padding:6px 14px;background:transparent;color:var(--mute);border:1px solid var(--line)}
.tab[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
ul{list-style:none;margin:14px 0 0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:12px}
.tabs+ul{margin-top:0}
li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
li>input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none}
.body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.txt{overflow-wrap:anywhere}
.due{font-size:.85rem;color:var(--mute)}
li.done .txt{text-decoration:line-through;color:var(--mute)}
li.late .due{color:var(--danger);font-weight:600}
.act{display:flex;gap:2px;flex:none}
.act button{background:transparent;padding:4px 8px;color:var(--accent)}
.act .del{color:var(--danger)}
.act .sv{background:var(--accent);color:var(--accent-ink);font-weight:600}
.empty{padding:28px 14px;text-align:center;color:var(--mute);display:block}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;color:var(--mute);font-size:.9rem}
.foot button{background:transparent;color:var(--mute);text-decoration:underline;padding:4px}
.st{color:var(--accent);min-height:1.4em;font-size:.9rem}
.tm{color:var(--accent);font-size:.85rem;font-weight:600;white-space:nowrap}
.al{grid-column:1/-1;display:flex;align-items:center;gap:6px;color:var(--mute);font-size:.9rem}
.ring{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:20;max-width:560px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:14px;display:none;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.ring b{display:block;font-size:1.1rem}
.ring .rb{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.ring button{background:var(--bg);color:var(--ink);padding:8px 14px;font-weight:600}
</style>

<ul id="list"></ul>
<div class="foot"><span id="count"></span><button id="clear" type="button"></button></div>
<div class="foot"><button id="tst" type="button"></button></div>
